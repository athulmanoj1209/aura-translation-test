<app-auth-layout>

  <!-- ======================= NO-TOKEN STATE ======================= -->
  <ng-container *ngIf="!token(); else formBlock">
    <h1 class="auth-greeting">Invalid link</h1>
    <p class="auth-greeting-sub">
      This password reset link is missing or no longer valid. Please request
      a new one from the sign-in page.
    </p>

    <p-button label="Back to sign in"
              styleClass="cta-button"
              (onClick)="goToLogin()" type="button"></p-button>
  </ng-container>

  <!-- ======================= FORM STATE =========================== -->
  <ng-template #formBlock>
    <h1 class="auth-greeting">Reset Password</h1>
    <p class="auth-greeting-sub">{{ headerSubtitle }}</p>

    <!-- Server-side error banner -->
    <div *ngIf="serverError() as msg" class="auth-banner auth-banner--error" role="alert">
      <app-draw-icon icon="pi pi-times-circle"></app-draw-icon>
      <span>{{ msg }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="auth-form">

      <!-- New password -->
      <div class="form-field">
        <label class="field-label" for="newPassword">NEW PASSWORD</label>
        <p-password id="newPassword"
                    formControlName="newPassword"
                    placeholder="Enter a new password"
                    autocomplete="new-password"
                    [feedback]="false"
                    [toggleMask]="true"
                    [invalid]="isInvalid('newPassword')"
                    styleClass="w-full"
                    inputStyleClass="w-full"></p-password>
        <small *ngIf="getError('newPassword','Password') as err" class="error-text">{{ err }}</small>
        <small *ngIf="!getError('newPassword','Password')" class="hint-text">
          Min 8 characters, must include letters, numbers, and a special character.
        </small>
      </div>

      <!-- Confirm password -->
      <div class="form-field">
        <label class="field-label" for="confirmPassword">CONFIRM PASSWORD</label>
        <p-password id="confirmPassword"
                    formControlName="confirmPassword"
                    placeholder="Re-enter the new password"
                    autocomplete="new-password"
                    [feedback]="false"
                    [toggleMask]="true"
                    [invalid]="isInvalid('confirmPassword')"
                    styleClass="w-full"
                    inputStyleClass="w-full"></p-password>
        <small *ngIf="getError('confirmPassword','Confirm Password') as err" class="error-text">{{ err }}</small>
      </div>

      <!-- Submit + Cancel -->
      <p-button label="Reset password"
                styleClass="cta-button"
                [loading]="submitting()"
                type="submit"></p-button>

      <button type="button" class="link-button link-button--center" (click)="onCancel()">
        Cancel and return to sign in
      </button>
    </form>
  </ng-template>

</app-auth-layout>
