<app-auth-layout>

  <!-- ======================= SENT STATE =========================== -->
  <ng-container *ngIf="sent(); else formBlock">
    <h1 class="auth-greeting">Check your inbox</h1>
    <p class="auth-greeting-sub">
      If an account exists for <strong>{{ sentToEmail() }}</strong>, you'll
      receive a password reset link shortly. Don't forget to check your spam.
    </p>

    <p-button label="Back to sign in"
              styleClass="cta-button"
              (onClick)="goToLogin()" type="button"></p-button>

    <button type="button" class="link-button link-button--center" (click)="tryAgain()">
      Didn't get it? Try a different email
    </button>
  </ng-container>

  <!-- ======================= FORM STATE =========================== -->
  <ng-template #formBlock>
    <h1 class="auth-greeting">Forgot Password?</h1>
    <p class="auth-greeting-sub">
      Enter your email and we'll send you a link to reset it.
    </p>

    <!-- Server error banner -->
    <div *ngIf="serverError() as msg" class="auth-banner auth-banner--error" role="alert">
      <app-draw-icon icon="pi pi-times-circle"></app-draw-icon>
      <span>{{ msg }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="auth-form">

      <!-- Email -->
      <div class="form-field">
        <label class="field-label" for="email">EMAIL</label>
        <input pInputText id="email" type="email"
               formControlName="email"
               placeholder="Your email"
               autocomplete="email"
               [invalid]="isInvalid('email')" />
        <small *ngIf="getError('email','Email') as err" class="error-text">{{ err }}</small>
      </div>

      <!-- Submit -->
      <p-button label="Send reset link"
                styleClass="cta-button"
                [loading]="submitting()"
                type="submit"></p-button>

      <p class="auth-footer-link">
        Remembered your password?
        <a routerLink="/login">Back to sign in</a>
      </p>
    </form>
  </ng-template>

</app-auth-layout>
