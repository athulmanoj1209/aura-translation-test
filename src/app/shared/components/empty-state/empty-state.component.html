<div class="empty-state-wrap">

  <!-- Illustration -->
  <div class="empty-state-illustration">
    <svg viewBox="0 0 220 200" width="178" height="162" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Left sparkles (cross/plus shapes) -->
      <g stroke="#8b92e0" stroke-linecap="round">
        <line x1="22" y1="78" x2="22" y2="94" stroke-width="2.8"/>
        <line x1="14" y1="86" x2="30" y2="86" stroke-width="2.8"/>
        <line x1="38" y1="52" x2="38" y2="62" stroke-width="2"/>
        <line x1="33" y1="57" x2="43" y2="57" stroke-width="2"/>
      </g>

      <!-- Document body (dog-ear path: top-right corner clipped) -->
      <path d="M58 20 H118 L142 44 V136 Q142 143 135 143 H65 Q58 143 58 136 Z" fill="#c3c8f5"/>

      <!-- Dog-ear fold (darker triangle) -->
      <path d="M118 20 L142 44 H118 Z" fill="#9ea6ed"/>

      <!-- Content lines on document -->
      <rect x="70" y="54" width="57" height="5" rx="2.5" fill="white" opacity="0.68"/>
      <rect x="70" y="66" width="44" height="4" rx="2" fill="white" opacity="0.48"/>
      <rect x="70" y="77" width="51" height="4" rx="2" fill="white" opacity="0.48"/>
      <rect x="70" y="88" width="37" height="4" rx="2" fill="white" opacity="0.36"/>

      <!-- Magnifying glass outer ring -->
      <circle cx="122" cy="122" r="27" fill="white" stroke="#9ea6ed" stroke-width="2.5"/>
      <!-- Magnifying glass inner tinted circle -->
      <circle cx="122" cy="122" r="17" fill="#e3e6fb"/>
      <!-- Handle -->
      <line x1="142" y1="142" x2="159" y2="159" stroke="#7b82dc" stroke-width="5" stroke-linecap="round"/>

      <!-- Dashed trajectory arc (paper-plane path) -->
      <path d="M 140 50 C 160 32 172 20 184 8"
            stroke="#9ea6ed" stroke-width="1.6" fill="none"
            stroke-dasharray="5,4.5" opacity="0.8"/>

      <!-- Paper-airplane triangle at arc end -->
      <path d="M184 3 L196 8 L188 18 L183 11 Z" fill="#9ea6ed" opacity="0.8"/>

    </svg>
  </div>

  <!-- Text -->
  <h3 class="empty-state-title">{{ title }}</h3>
  @if (description) {
    <p class="empty-state-desc">{{ description }}</p>
  }

  <!-- Action button (optional) -->
  @if (showAction) {
    <p-button
      [label]="actionLabel"
      [icon]="actionIcon"
      styleClass="empty-state-action-btn"
      (onClick)="actionClick.emit()"
    />
  }

</div>
